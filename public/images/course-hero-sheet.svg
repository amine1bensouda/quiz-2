<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="sheetGlow" x1="80" y1="40" x2="360" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2be4c8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="pencilBody" x1="250" y1="40" x2="390" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5c14a"/>
      <stop offset="1" stop-color="#e0a820"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <ellipse cx="300" cy="210" rx="150" ry="110" fill="url(#sheetGlow)" filter="url(#softBlur)"/>

  <!-- answer sheet -->
  <g transform="translate(48 36) rotate(-8 150 150)">
    <rect x="0" y="0" width="250" height="300" rx="10" fill="#f4f1ea" opacity="0.92"/>
    <rect x="0" y="0" width="250" height="300" rx="10" stroke="#d7d0c4" stroke-width="2"/>
    <text x="24" y="34" fill="#2a2540" font-family="Georgia, serif" font-size="18" font-weight="700">SAT</text>
    <text x="70" y="34" fill="#6b6480" font-family="Arial, sans-serif" font-size="11">ANSWER SHEET</text>

    <!-- header lines -->
    <rect x="24" y="48" width="120" height="8" rx="2" fill="#e4dfd5"/>
    <rect x="156" y="48" width="70" height="8" rx="2" fill="#e4dfd5"/>

    <!-- bubble grid -->
    <g fill="none" stroke="#9a93ad" stroke-width="1.4">
      <g transform="translate(28 78)">
        <circle cx="10" cy="10" r="7"/><circle cx="34" cy="10" r="7"/><circle cx="58" cy="10" r="7"/><circle cx="82" cy="10" r="7"/><circle cx="106" cy="10" r="7"/>
        <circle cx="10" cy="36" r="7"/><circle cx="34" cy="36" r="7"/><circle cx="58" cy="36" r="7"/><circle cx="82" cy="36" r="7"/><circle cx="106" cy="36" r="7"/>
        <circle cx="10" cy="62" r="7"/><circle cx="34" cy="62" r="7"/><circle cx="58" cy="62" r="7"/><circle cx="82" cy="62" r="7"/><circle cx="106" cy="62" r="7"/>
        <circle cx="10" cy="88" r="7"/><circle cx="34" cy="88" r="7"/><circle cx="58" cy="88" r="7"/><circle cx="82" cy="88" r="7"/><circle cx="106" cy="88" r="7"/>
        <circle cx="10" cy="114" r="7"/><circle cx="34" cy="114" r="7"/><circle cx="58" cy="114" r="7"/><circle cx="82" cy="114" r="7"/><circle cx="106" cy="114" r="7"/>
        <circle cx="10" cy="140" r="7"/><circle cx="34" cy="140" r="7"/><circle cx="58" cy="140" r="7"/><circle cx="82" cy="140" r="7"/><circle cx="106" cy="140" r="7"/>
        <circle cx="10" cy="166" r="7"/><circle cx="34" cy="166" r="7"/><circle cx="58" cy="166" r="7"/><circle cx="82" cy="166" r="7"/><circle cx="106" cy="166" r="7"/>
        <circle cx="10" cy="192" r="7"/><circle cx="34" cy="192" r="7"/><circle cx="58" cy="192" r="7"/><circle cx="82" cy="192" r="7"/><circle cx="106" cy="192" r="7"/>
      </g>
    </g>
    <!-- filled bubbles -->
    <g fill="#2a2540">
      <circle cx="62" cy="88" r="5.5"/>
      <circle cx="110" cy="114" r="5.5"/>
      <circle cx="38" cy="140" r="5.5"/>
      <circle cx="86" cy="166" r="5.5"/>
      <circle cx="134" cy="192" r="5.5"/>
      <circle cx="62" cy="218" r="5.5"/>
      <circle cx="110" cy="244" r="5.5"/>
    </g>
  </g>

  <!-- pencil -->
  <g transform="translate(250 30) rotate(28)">
    <rect x="0" y="0" width="28" height="210" rx="4" fill="url(#pencilBody)"/>
    <rect x="0" y="0" width="28" height="28" rx="4" fill="#f7d98a"/>
    <rect x="4" y="0" width="4" height="210" fill="#fff" opacity="0.25"/>
    <polygon points="0,210 28,210 14,248" fill="#e8d4b0"/>
    <polygon points="8,232 20,232 14,248" fill="#2a2540"/>
    <rect x="2" y="-14" width="24" height="18" rx="3" fill="#d4576a"/>
    <rect x="4" y="-8" width="20" height="6" rx="2" fill="#c0bcc8"/>
  </g>
</svg>
